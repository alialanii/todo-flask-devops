name: Flask Todo CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # خطوة بناء وصيانة صورة الـ Docker مباشرة
    - name: Build Docker Image
      run: |
        docker build -t todo-flask-app:latest .